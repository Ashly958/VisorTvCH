; PHP Configuration for Visor TV Sistemas
; Allows high-definition (HD, Full HD, 4K, 8K) videos without size or duration restrictions

upload_max_filesize = 10G
post_max_size = 10G
memory_limit = 2048M
max_execution_time = 3600
max_input_time = 3600
default_socket_timeout = 3600
client_body_buffer_size = 128M

; Enable extensions if needed
extension_dir = "ext"
