<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#glow)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Badge -->
  <rect x="140" y="240" width="300" height="56" rx="28" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="2" />
  <text x="290" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="3">BIENVENIDOS</text>

  <!-- Title -->
  <text x="140" y="420" fill="#ffffff" font-family="system-ui, sans-serif" font-size="72" font-weight="900">Bienvenida Sede Principal</text>

  <!-- Subtitle -->
  <text x="140" y="510" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="32" font-weight="400">Horario de atención: Lunes a Viernes de 8:00 AM a 6:00 PM</text>

  <!-- Decorative Footer Bar -->
  <rect x="140" y="880" width="1640" height="80" rx="20" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="190" y="930" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">● VISOR DIGITAL INFORMATIVO</text>
  <text x="1730" y="930" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="500" text-anchor="end">Información Institucional 2026</text>
</svg>